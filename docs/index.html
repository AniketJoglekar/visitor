<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10162B">
<meta name="referrer" content="no-referrer">
<!-- Hidden until guard.js confirms this page is not inside a frame. Removing
     this style tag without removing guard.js leaves the scanner framable. -->
<style id="framebust">html { display: none !important; }</style>
<noscript><style>html { display: block !important; }</style></noscript>
<script src="guard.js"></script>
<meta http-equiv="Content-Security-Policy" content="
  default-src 'none';
  script-src 'self' https://accounts.google.com;
  style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
  font-src https://fonts.gstatic.com;
  img-src 'self' data: blob: https://ssl.gstatic.com https://www.gstatic.com https://lh3.googleusercontent.com;
  connect-src https://script.google.com https://*.googleusercontent.com https://script.googleusercontent.com https://accounts.google.com;
  frame-src https://accounts.google.com;
  base-uri 'none';
  form-action 'none';
  object-src 'none'">
<!-- frame-ancestors is deliberately absent: browsers ignore it in a <meta> CSP,
     and GitHub Pages cannot set headers. Framing is blocked by guard.js. -->
<title>IIT Tirupati Visitor Pass Scanner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink:        #10162B;
    --surface:    #1A2340;
    --raised:     #232E51;
    --hairline:   #2E3A5F;
    --text:       #E8ECF7;
    --muted:      #8C97B5;
    --brass:      #C9A227;
    --allow:      #17B278;
    --allow-deep: #063D2A;
    --deny:       #EE4038;
    --deny-deep:  #47100D;
    --warn:       #EFA01E;
    --warn-deep:  #40290A;

    --display: 'Archivo', system-ui, sans-serif;
    --body: 'IBM Plex Sans', system-ui, sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, monospace;
  }

  * { box-sizing: border-box; }

  /* Author display rules outrank the browser's [hidden] rule at equal
     specificity, which silently un-hides anything styled with display.
     This makes the attribute authoritative again. */
  [hidden] { display: none !important; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--ink);
    color: var(--text);
    font-family: var(--body);
    -webkit-text-size-adjust: 100%;
    overscroll-behavior: none;
  }

  body {
    display: flex;
    flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  button {
    font: inherit;
    color: inherit;
    border: 0;
    background: none;
    cursor: pointer;
  }

  :focus-visible {
    outline: 2px solid var(--brass);
    outline-offset: 3px;
  }

  /* ---------- header ---------- */

  .bar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: clamp(7px, 1.4vh, 13px) 16px;
    border-bottom: 1px solid var(--hairline);
    flex: 0 0 auto;
  }

  .bar__mark {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
  }

  .bar__mark-top {
    font-family: var(--display);
    font-variation-settings: 'wdth' 118, 'wght' 700;
    font-size: 11px;
    line-height: 1;
    letter-spacing: 0.11em;
    text-transform: uppercase;
    color: var(--brass);
  }

  .bar__mark-sub {
    font-family: var(--display);
    font-variation-settings: 'wdth' 104, 'wght' 600;
    font-size: 15px;
    line-height: 1.1;
    letter-spacing: -0.005em;
    color: var(--text);
    white-space: nowrap;
  }

  .bar__who {
    font-size: 13px;
    color: var(--text);
    margin-left: auto;
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .bar__out {
    flex: 0 0 auto;
    padding: 7px 12px;
    border: 1px solid var(--hairline);
    border-radius: 8px;
    font-size: 13px;
    color: var(--muted);
  }

  /* ---------- panes ---------- */

  .pane { display: none; flex: 1 1 auto; min-height: 0; }
  .pane[data-active] { display: flex; flex-direction: column; }

  .pad { padding: 24px 20px 28px; }

  h1 {
    font-family: var(--display);
    font-variation-settings: 'wdth' 108, 'wght' 700;
    font-size: 26px;
    line-height: 1.15;
    margin: 0 0 8px;
  }

  h2 {
    font-family: var(--display);
    font-variation-settings: 'wdth' 112, 'wght' 700;
    font-size: clamp(19px, 4.2vw, 23px);
    line-height: 1.2;
    letter-spacing: 0.01em;
    margin: 0;
  }

  .signin { align-items: center; text-align: center; }

  /* Two auto margins split the spare height: the heading and button sit near
     the middle, the dashboard link settles at the bottom. */
  .signin__mid {
    margin-top: auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    width: 100%;
  }

  .signin .sidelink { margin-top: auto; margin-bottom: 2px; }

  .btn {
    display: block;
    width: 100%;
    padding: clamp(10px, 1.9vh, 16px) 18px;
    border-radius: 11px;
    background: var(--raised);
    border: 1px solid var(--hairline);
    font-weight: 600;
    font-size: 16px;
    text-align: center;
  }

  .btn--primary {
    background: var(--brass);
    border-color: var(--brass);
    color: #1C1503;
  }



  /* ---------- scanning ---------- */

  .scan {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 18px;
    min-height: 0;
  }

  .viewport {
    position: relative;
    width: min(100%, 62vh);
    aspect-ratio: 1;
    border-radius: 18px;
    overflow: hidden;
    background: #05080F;
    border: 1px solid var(--hairline);
  }

  .viewport video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .reticle {
    position: absolute;
    inset: 13%;
    border-radius: 12px;
    box-shadow: 0 0 0 100vmax rgba(6, 9, 18, 0.5);
  }

  .reticle::before,
  .reticle::after {
    content: '';
    position: absolute;
    width: 30px;
    height: 30px;
    border: 2px solid var(--brass);
  }

  .reticle::before {
    top: -1px; left: -1px;
    border-right: 0; border-bottom: 0;
    border-radius: 12px 0 0 0;
  }

  .reticle::after {
    bottom: -1px; right: -1px;
    border-left: 0; border-top: 0;
    border-radius: 0 0 12px 0;
  }

  /* Same footprint as the viewport so nothing shifts when they swap. */
  .checking {
    width: min(100%, 62vh);
    aspect-ratio: 1;
    border-radius: 18px;
    border: 1px solid var(--hairline);
    background: var(--surface);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    text-align: center;
    padding: 24px;
  }

  .checking .spinner { width: 30px; height: 30px; border-width: 3px; }

  .checking__label {
    margin: 0;
    font-family: var(--display);
    font-variation-settings: 'wdth' 104, 'wght' 600;
    font-size: 19px;
    color: var(--text);
  }

  .checking__timer {
    margin: 0;
    font-family: var(--mono);
    font-size: 26px;
    line-height: 1;
    color: var(--brass);
    font-variant-numeric: tabular-nums;
  }


  .mode__title { font-size: 20px; margin: 0 0 20px; }
  /* A grid with two explicitly equal columns, not flex. .btn carries
     width: 100% and its own padding, and letting the browser resolve a flex
     basis against those produced two buttons of visibly different widths.
     1fr 1fr is equal by definition, whatever the labels or padding are. */
  .mode__choices { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .btn--big { padding: 26px 12px; font-size: 20px; font-weight: 700; }
  .mode__vehicle { margin-top: 26px; }
  .mode__chosen { margin: 0 0 14px; opacity: .75; }
  .mode__label { display: block; margin-bottom: 8px; font-weight: 600; }
  .mode__input {
    width: 100%; box-sizing: border-box; padding: 14px;
    font-size: 18px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--surface); color: var(--text);
    text-transform: uppercase;
  }
  .mode__vehicle .btn { width: 100%; margin-top: 14px; }
  .btn--quiet { background: transparent; border: 1px solid currentColor; opacity: .8; }
  .bar__mode { opacity: .75; }


  /* The bar spans the full width. The switch sits ON it, at the right, rather
     than beside it — side by side the bar was squeezed to a square by a button
     whose width depends on its label. */
  .scan__modebar {
    position: relative;
    /* Set down from the top edge: flush against it the line read as part of
       the header bar rather than as a statement about this scan. */
    margin: 18px 0 14px;
    padding: 12px 14px;
    border-radius: 10px;
    background: var(--surface);
    border: 1px solid var(--line);
  }
  .scan__mode {
    display: block;
    /* Room reserved on the right so a long direction never runs under the
       button. */
    padding-right: 22%;
    font-size: 19px; font-weight: 700; letter-spacing: .04em;
  }
  .btn--switch {
    position: absolute; top: 50%; right: 10px; transform: translateY(-50%);
    max-width: 20%; padding: 8px 0; width: 20%;
    font-size: 14px; font-weight: 700;
    background: #f5b301; color: #1a1400; border: 0; border-radius: 8px;
  }

  /* Equal size regardless of label length, and visually distinct from each
     other without borrowing the verdict palette: green means ALLOW and red
     means DENY elsewhere, so neither is used here. */
  /* box-sizing so the padding cannot push a cell wider than its column. */
  .mode__choices .btn { width: 100%; min-width: 0; box-sizing: border-box; }
  #modeEntry { background: #1f6feb; color: #fff; }
  #modeExit  { background: #8250df; color: #fff; }
  .mode__choices .btn[data-chosen] { outline: 3px solid #fff; outline-offset: 2px; }

  .checking__note {
    margin: 0;
    font-size: 14px;
    line-height: 1.45;
    color: var(--muted);
    max-width: 24ch;
  }

  .facts dd a {
    color: var(--brass);
    text-decoration: none;
    border-bottom: 1px solid rgba(201, 162, 55, 0.4);
  }

  .scan__hint {
    font-size: 14px;
    color: var(--muted);
    text-align: center;
    min-height: 1.4em;
  }

  /* ---------- verdict ---------- */

  /* No display declaration here on purpose — .pane[data-active] owns that.
     Adding one back re-breaks pane switching. */
  .verdict { overflow-y: auto; }

  .verdict__banner,
  .facts,
  .flag { animation: rise 260ms cubic-bezier(0.22, 0.61, 0.36, 1) both; }

  .facts { animation-delay: 40ms; }

  @keyframes rise {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: none; }
  }

  .verdict__banner {
    position: relative;
    padding: clamp(16px, 3.4vh, 32px) 20px clamp(12px, 2.6vh, 24px);
    background: var(--deny-deep);
    border-bottom: 2px solid var(--deny);
  }

  /* Depletes over the idle window, so the screen visibly intends to clear
     itself rather than sitting on a visitor's details indefinitely. */
  .meter {
    position: absolute;
    top: 0; left: 0;
    height: 2px;
    width: 100%;
    background: currentColor;
    opacity: 0.5;
    transform-origin: left center;
    color: var(--deny);
  }

  .verdict--allow .meter { color: var(--allow); }

  .meter--run { animation: deplete var(--idle, 90s) linear forwards; }

  @keyframes deplete { to { transform: scaleX(0); } }

  .verdict--allow .verdict__banner {
    background: var(--allow-deep);
    border-bottom-color: var(--allow);
  }

  .verdict__word {
    font-family: var(--display);
    font-variation-settings: 'wdth' 125, 'wght' 800;
    font-size: clamp(19px, 3.8vh, 29px);
    line-height: 1;
    letter-spacing: 0.01em;
    margin: 0;
    min-height: 1em;        /* keeps layout steady between states */
    color: var(--deny);
  }

  .verdict--allow .verdict__word { color: var(--allow); }

  .verdict__name {
    font-family: var(--display);
    font-variation-settings: 'wdth' 100, 'wght' 600;
    font-size: clamp(18px, 3.2vh, 25px);
    line-height: 1.2;
    margin: clamp(6px, 1.3vh, 11px) 0 0;
    overflow-wrap: anywhere;
  }

  .verdict__name:empty { display: none; }

  .verdict__reason:empty,
  .verdict__type:empty,
  .verdict__affil:empty { display: none; }

  /* Type and affiliation ride with the name rather than sitting in the facts
     grid — they answer "who is this" and belong beside it. */
  .verdict__type {
    margin: clamp(5px, 1.1vh, 9px) 0 0;
    font-size: 14px;
    line-height: 1.35;
    color: var(--text);
    opacity: 0.85;
  }

  .verdict__affil {
    margin: 3px 0 0;
    font-size: 13px;
    line-height: 1.35;
    color: var(--muted);
    overflow-wrap: anywhere;
  }

  .verdict__reason {
    margin: clamp(6px, 1.2vh, 10px) 0 0;
    font-size: 15px;
    line-height: 1.45;
    color: var(--text);
    opacity: 0.9;
  }

  /* Photograph sits inside the verdict panel, beside the name, so the guard
     sees the face and the decision in one glance without pressing anything. */
  .verdict__head {
    display: flex;
    align-items: stretch;
    gap: clamp(18px, 5vw, 32px);
  }

  /* The photo is now the taller element, so the text is centred against it
     rather than top-aligned with a gap trailing beneath. */
  .verdict__lines {
    min-width: 0;
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .verdict__photo {
    flex: 0 0 auto;
    width: clamp(112px, 23vh, 196px);
    aspect-ratio: 3 / 4;
    padding: 0;
    border-radius: 10px;
    overflow: hidden;
    background: #05080F;
    border: 1px solid rgba(232, 236, 247, 0.22);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  .verdict__photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .verdict__photo[data-empty] img { display: none; }

  .verdict__photo small {
    font-size: 11px;
    line-height: 1.3;
    color: var(--muted);
    text-align: center;
    padding: 6px;
  }

  .verdict__photo[data-loaded] small { display: none; }

  /* A failed photograph turns the tile into a retry control. It is already a
     button, so a nested one would be invalid markup — and the whole tile is a
     far better tap target on a phone than a small button inside it. */
  .verdict__photo[data-failed] {
    border-color: var(--warn);
    background: var(--warn-deep);
  }

  .verdict__photo[data-failed] small { color: var(--text); }

  /* signature element: where "now" sits inside the visit window */

  .track { margin: clamp(8px, 2.2vh, 20px) 0 0; }

  .track__rail {
    position: relative;
    height: 6px;
    border-radius: 3px;
    background: rgba(232, 236, 247, 0.16);
    overflow: visible;
  }

  .track__fill {
    position: absolute;
    inset: 0 auto 0 0;
    border-radius: 3px;
    background: var(--allow);
    width: 0;
  }

  .track__now {
    position: absolute;
    top: -5px;
    width: 2px;
    height: 16px;
    background: var(--text);
    border-radius: 1px;
    left: 0;
  }

  .track__ends {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    margin-top: 7px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
  }

  .track__remaining {
    margin: clamp(3px, 0.9vh, 8px) 0 0;
    font-size: 13px;
    color: var(--muted);
  }

  .flag {
    display: flex;
    gap: 10px;
    margin: 12px 20px 0;
    padding: 11px 14px;
    border-radius: 10px;
    background: var(--warn-deep);
    border: 1px solid var(--warn);
    font-size: 14px;
    line-height: 1.5;
  }

  .flag__dot {
    flex: 0 0 auto;
    width: 8px;
    height: 8px;
    margin-top: 6px;
    border-radius: 50%;
    background: var(--warn);
  }

  .facts:empty { display: none; }

  .facts {
    margin: 0;               /* hug the verdict panel */
    padding: clamp(6px, 2vh, 18px) 20px 2px;
    display: grid;
    grid-template-columns: minmax(76px, auto) 1fr;
    gap: 6px 16px;
    align-items: baseline;
  }

  .facts dt {
    font-size: 11px;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .facts dd {
    margin: 0;
    font-size: 14px;
    line-height: 1.4;
  }

  /* Venue is free text from the form. It is usually short ("AB1"), but the
     clamp stays: two lines is enough to tell a guard where someone is going,
     and it stops one verbose entry pushing the buttons off screen. */
  .facts dd.clamp {
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .actions {
    margin-top: auto;        /* spare height collects here, below the detail */
    padding: clamp(6px, 1.6vh, 14px) 20px clamp(8px, 2vh, 18px);
  }

  .btn + .btn { margin-top: 10px; }

  /* Secondary on purpose. Gate staff have no use for the dashboard and are
     refused by it; this is here for the security head who opens the scanner
     URL out of habit. */
  .sidelink {
    display: inline-block;
    margin-top: 26px;
    align-self: center;
    padding: 11px 16px;
    border: 1px solid var(--hairline);
    border-radius: 10px;
    color: var(--muted);
    font-size: 14px;
    text-decoration: none;
  }

  .sidelink:hover,
  .sidelink:focus-visible { color: var(--text); border-color: var(--brass); }

  .sidelink span { color: var(--brass); }

  /* ---------- photo overlay ---------- */

  .photo {
    position: fixed;
    inset: 0;
    z-index: 40;
    background: #000;
    display: none;
    flex-direction: column;
  }

  .photo[data-open] { display: flex; }

  .photo__stage {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* largest size that preserves the photo's own aspect ratio */
  .photo__stage img {
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    object-fit: contain;
    display: block;
  }

  .photo__foot {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 18px calc(14px + env(safe-area-inset-bottom));
    background: #000;
  }

  .photo__name {
    font-family: var(--mono);
    font-size: 13px;
    color: #C6CBD8;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .photo__close {
    margin-left: auto;
    padding: 10px 18px;
    border: 1px solid #3A3A3A;
    border-radius: 9px;
    font-weight: 600;
    font-size: 15px;
  }

  .photo__status {
    color: #8C97B5;
    font-size: 14px;
    text-align: center;
    padding: 0 24px;
  }

  /* ---------- misc ---------- */

  .notice {
    margin: 16px 20px 0;
    padding: 13px 15px;
    border-radius: 10px;
    background: var(--deny-deep);
    border: 1px solid var(--deny);
    font-size: 14px;
    line-height: 1.5;
  }

  .signin__busy {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    margin-top: 8px;
  }
  .signin__busy-label {
    margin: 0;
    font-size: 15px;
    opacity: 0.75;
  }

  .spinner {
    width: 17px;
    height: 17px;
    border: 2px solid rgba(232, 236, 247, 0.28);
    border-top-color: var(--text);
    border-radius: 50%;
    display: inline-block;
    vertical-align: -3px;
    animation: spin 0.7s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  @media (prefers-reduced-motion: reduce) {
    .spinner { animation-duration: 2.4s; }
    .verdict__banner, .facts, .flag { animation: none; }
    .meter--run { animation: none; opacity: 0.25; }
    * { transition: none !important; }
  }
</style>
</head>
<body>

<noscript>
  <p style="padding:24px;font:16px/1.5 system-ui,sans-serif;color:#E8ECF7">
    This scanner needs JavaScript. Enable it, then reload.
  </p>
</noscript>

<header class="bar">
  <span class="bar__mark">
    <span class="bar__mark-top">IIT Tirupati</span>
    <span class="bar__mark-sub">Visitor Pass Scanner</span>
  </span>
  <span class="bar__who" id="barWho" hidden></span>
  <button class="bar__out" id="signOut" hidden>Sign out</button>
</header>

<!-- Sign in -->
<section class="pane pad signin" id="paneSignin" data-active>
  <div class="signin__mid">
    <h2>Authorized Personnel Only</h2>
    <div id="gsiButton"></div>
    <!-- Shown while the ID token is being checked with the server. The Google
         button used to stay on screen with nothing happening, which reads as a
         dead button — and with retries a slow content hop can hold this for a
         minute. -->
    <div class="signin__busy" id="signinBusy" hidden>
      <span class="spinner"></span>
      <p class="signin__busy-label" id="signinBusyLabel">Checking your access…</p>
    </div>
    <p class="notice" id="signinError" hidden></p>
  </div>
  <a class="sidelink" href="dashboard.html">Pass dashboard <span>&rarr;</span></a>
</section>

<!-- Camera -->
<!-- Chosen once per sign-in, then applied to every scan in the session. It sits
     between sign-in and the camera because a guard works one direction at a
     time, and asking per scan would add a tap to every visitor. -->
<section class="pane pad mode" id="paneMode">
  <h2 class="mode__title" id="modeTitle">Are you recording entries or exits?</h2>
  <div class="mode__choices" id="modeChoices">
    <button class="btn btn--big" id="modeEntry">Entry</button>
    <button class="btn btn--big" id="modeExit">Exit</button>
  </div>

  <div class="mode__vehicle" id="modeVehicle" hidden>
    <!-- The two buttons above stay live, so switching is one tap and no
         separate Change control is needed. -->
    <p class="mode__chosen" id="modeChosen"></p>
    <label class="mode__label" for="vehicleNumber">Vehicle number (if any)</label>
    <input class="mode__input" id="vehicleNumber" type="text" autocomplete="off"
           autocapitalize="characters" spellcheck="false" maxlength="40"
           placeholder="Leave blank if none">
    <button class="btn btn--primary" id="modeEnter">Enter</button>
  </div>
</section>

<section class="pane" id="paneScan">
  <div class="scan__modebar">
    <span class="scan__mode" id="scanMode"></span>
    <button class="btn btn--switch" id="switchMode">Switch</button>
  </div>
  <div class="scan">
    <div class="viewport" id="viewport">
      <video id="video" playsinline muted></video>
      <div class="reticle"></div>
    </div>

    <div class="checking" id="checking" hidden>
      <span class="spinner"></span>
      <p class="checking__label">Pass captured</p>
      <p class="checking__timer" id="checkingTimer">0.0s</p>
      <p class="checking__note" id="checkingNote">You can take the pass away. Checking with the server…</p>
    </div>

    <p class="scan__hint" id="scanHint">Hold the visitor's QR code inside the frame.</p>
  </div>
  <p class="notice" id="scanError" hidden></p>
  <!-- Offered only after a scan gives up. Re-asks for the same pass with the
       same request id, so within the replay window it returns the decision the
       server already made rather than recording a second entry. -->
  <button class="btn btn--primary" id="scanRetry" hidden>Try this pass again</button>
</section>

<!-- Verdict -->
<section class="pane verdict" id="paneVerdict">
  <div class="verdict__banner">
    <div class="meter" id="meter" aria-hidden="true"></div>
    <div class="verdict__head">
      <button class="verdict__photo" id="verdictPhoto" data-empty hidden>
        <img id="verdictPhotoImg" alt="">
        <small id="verdictPhotoNote">Loading photo…</small>
      </button>
      <div class="verdict__lines">
        <p class="verdict__word" id="verdictWord"></p>
        <p class="verdict__name" id="verdictName"></p>
        <p class="verdict__type" id="verdictType"></p>
        <p class="verdict__affil" id="verdictAffil"></p>
        <p class="verdict__reason" id="verdictReason"></p>
      </div>
    </div>
    <div class="track" id="track" hidden>
      <div class="track__rail">
        <div class="track__fill" id="trackFill"></div>
        <div class="track__now" id="trackNow"></div>
      </div>
      <div class="track__ends">
        <span id="trackFrom"></span>
        <span id="trackUntil"></span>
      </div>
      <p class="track__remaining" id="trackRemaining"></p>
    </div>
  </div>

  <div class="flag" id="verdictFlag" hidden>
    <span class="flag__dot"></span>
    <span id="verdictFlagText"></span>
  </div>

  <dl class="facts" id="verdictFacts"></dl>

  <div class="actions">
    <button class="btn btn--primary" id="scanNext">Scan next visitor</button>
  </div>
</section>

<!-- Photo overlay -->
<div class="photo" id="photoOverlay" role="dialog" aria-modal="true" aria-label="Visitor photograph">
  <div class="photo__stage">
    <p class="photo__status" id="photoStatus"><span class="spinner"></span></p>
    <img id="photoImg" alt="" hidden>
  </div>
  <div class="photo__foot">
    <span class="photo__name" id="photoName"></span>
    <button class="photo__close" id="photoClose">Close</button>
  </div>
</div>
