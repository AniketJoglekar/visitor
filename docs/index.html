<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10162B">
<meta name="referrer" content="no-referrer">
<script src="guard.js"></script>
<meta http-equiv="Content-Security-Policy" content="
  default-src 'none';
  script-src 'self' https://accounts.google.com;
  style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
  font-src https://fonts.gstatic.com;
  img-src 'self' data: blob: https://ssl.gstatic.com https://www.gstatic.com https://lh3.googleusercontent.com;
  connect-src https://script.google.com https://script.googleusercontent.com https://accounts.google.com;
  frame-src https://accounts.google.com;
  base-uri 'none';
  form-action 'none';
  object-src 'none'">
<!-- frame-ancestors is deliberately absent: browsers ignore it in a <meta> CSP,
     and GitHub Pages cannot set headers. Framing is blocked by guard.js. -->
<title>IIT Tirupati Visitor Pass Scanner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink:        #10162B;
    --surface:    #1A2340;
    --raised:     #232E51;
    --hairline:   #2E3A5F;
    --text:       #E8ECF7;
    --muted:      #8C97B5;
    --brass:      #C9A227;
    --allow:      #17B278;
    --allow-deep: #063D2A;
    --deny:       #EE4038;
    --deny-deep:  #47100D;
    --warn:       #EFA01E;
    --warn-deep:  #40290A;

    --display: 'Archivo', system-ui, sans-serif;
    --body: 'IBM Plex Sans', system-ui, sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, monospace;
  }

  * { box-sizing: border-box; }

  /* Author display rules outrank the browser's [hidden] rule at equal
     specificity, which silently un-hides anything styled with display.
     This makes the attribute authoritative again. */
  [hidden] { display: none !important; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--ink);
    color: var(--text);
    font-family: var(--body);
    -webkit-text-size-adjust: 100%;
    overscroll-behavior: none;
  }

  body {
    display: flex;
    flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  button {
    font: inherit;
    color: inherit;
    border: 0;
    background: none;
    cursor: pointer;
  }

  :focus-visible {
    outline: 2px solid var(--brass);
    outline-offset: 3px;
  }

  /* ---------- header ---------- */

  .bar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--hairline);
    flex: 0 0 auto;
  }

  .bar__mark {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
  }

  .bar__mark-top {
    font-family: var(--display);
    font-variation-settings: 'wdth' 118, 'wght' 700;
    font-size: 11px;
    line-height: 1;
    letter-spacing: 0.11em;
    text-transform: uppercase;
    color: var(--brass);
  }

  .bar__mark-sub {
    font-family: var(--display);
    font-variation-settings: 'wdth' 104, 'wght' 600;
    font-size: 15px;
    line-height: 1.1;
    letter-spacing: -0.005em;
    color: var(--text);
    white-space: nowrap;
  }

  .bar__who {
    font-size: 13px;
    color: var(--text);
    margin-left: auto;
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .gatestrip {
    flex: 0 0 auto;
    padding: 9px 16px 10px;
    text-align: center;
    border-bottom: 1px solid var(--hairline);
    background: var(--surface);
  }

  .gatestrip__label {
    display: block;
    font-size: 10px;
    letter-spacing: 0.13em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 3px;
  }

  .gatestrip__name {
    font-family: var(--display);
    font-variation-settings: 'wdth' 106, 'wght' 600;
    font-size: 16px;
    line-height: 1.1;
    color: var(--text);
  }

  .bar__out {
    flex: 0 0 auto;
    padding: 7px 12px;
    border: 1px solid var(--hairline);
    border-radius: 8px;
    font-size: 13px;
    color: var(--muted);
  }

  /* ---------- panes ---------- */

  .pane { display: none; flex: 1 1 auto; min-height: 0; }
  .pane[data-active] { display: flex; flex-direction: column; }

  .pad { padding: 24px 20px 28px; }

  h1 {
    font-family: var(--display);
    font-variation-settings: 'wdth' 108, 'wght' 700;
    font-size: 26px;
    line-height: 1.15;
    margin: 0 0 8px;
  }

  .lede {
    color: var(--muted);
    font-size: 14px;
    line-height: 1.6;
    margin: 0 0 22px;
    max-width: 44ch;
  }

  label.field {
    display: block;
    font-size: 12px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 7px;
  }

  select {
    width: 100%;
    padding: 13px 14px;
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-radius: 10px;
    color: var(--text);
    font-family: var(--body);
    font-size: 16px;
  }

  .btn {
    display: block;
    width: 100%;
    padding: 13px 18px;
    border-radius: 11px;
    background: var(--raised);
    border: 1px solid var(--hairline);
    font-weight: 600;
    font-size: 16px;
    text-align: center;
  }

  .btn--primary {
    background: var(--brass);
    border-color: var(--brass);
    color: #1C1503;
  }



  /* ---------- scanning ---------- */

  .scan {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 18px;
    min-height: 0;
  }

  .viewport {
    position: relative;
    width: min(100%, 62vh);
    aspect-ratio: 1;
    border-radius: 18px;
    overflow: hidden;
    background: #05080F;
    border: 1px solid var(--hairline);
  }

  .viewport video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .reticle {
    position: absolute;
    inset: 13%;
    border-radius: 12px;
    box-shadow: 0 0 0 100vmax rgba(6, 9, 18, 0.5);
  }

  .reticle::before,
  .reticle::after {
    content: '';
    position: absolute;
    width: 30px;
    height: 30px;
    border: 2px solid var(--brass);
  }

  .reticle::before {
    top: -1px; left: -1px;
    border-right: 0; border-bottom: 0;
    border-radius: 12px 0 0 0;
  }

  .reticle::after {
    bottom: -1px; right: -1px;
    border-left: 0; border-top: 0;
    border-radius: 0 0 12px 0;
  }

  /* Same footprint as the viewport so nothing shifts when they swap. */
  .checking {
    width: min(100%, 62vh);
    aspect-ratio: 1;
    border-radius: 18px;
    border: 1px solid var(--hairline);
    background: var(--surface);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    text-align: center;
    padding: 24px;
  }

  .checking .spinner { width: 30px; height: 30px; border-width: 3px; }

  .checking__label {
    margin: 0;
    font-family: var(--display);
    font-variation-settings: 'wdth' 104, 'wght' 600;
    font-size: 19px;
    color: var(--text);
  }

  .checking__timer {
    margin: 0;
    font-family: var(--mono);
    font-size: 26px;
    line-height: 1;
    color: var(--brass);
    font-variant-numeric: tabular-nums;
  }

  .checking__note {
    margin: 0;
    font-size: 14px;
    line-height: 1.45;
    color: var(--muted);
    max-width: 24ch;
  }

  .facts dd a {
    color: var(--brass);
    text-decoration: none;
    border-bottom: 1px solid rgba(201, 162, 55, 0.4);
  }

  .scan__hint {
    font-size: 14px;
    color: var(--muted);
    text-align: center;
    min-height: 1.4em;
  }

  /* ---------- verdict ---------- */

  /* No display declaration here on purpose — .pane[data-active] owns that.
     Adding one back re-breaks pane switching. */
  .verdict { overflow-y: auto; }

  .verdict__banner,
  .facts,
  .flag { animation: rise 260ms cubic-bezier(0.22, 0.61, 0.36, 1) both; }

  .facts { animation-delay: 40ms; }

  @keyframes rise {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: none; }
  }

  .verdict__banner {
    position: relative;
    padding: 20px 20px 16px;
    background: var(--deny-deep);
    border-bottom: 2px solid var(--deny);
  }

  /* Depletes over the idle window, so the screen visibly intends to clear
     itself rather than sitting on a visitor's details indefinitely. */
  .meter {
    position: absolute;
    top: 0; left: 0;
    height: 2px;
    width: 100%;
    background: currentColor;
    opacity: 0.5;
    transform-origin: left center;
    color: var(--deny);
  }

  .verdict--allow .meter { color: var(--allow); }

  .meter--run { animation: deplete var(--idle, 90s) linear forwards; }

  @keyframes deplete { to { transform: scaleX(0); } }

  .verdict--allow .verdict__banner {
    background: var(--allow-deep);
    border-bottom-color: var(--allow);
  }

  .verdict__word {
    font-family: var(--display);
    font-variation-settings: 'wdth' 125, 'wght' 800;
    font-size: clamp(34px, 11vw, 52px);
    line-height: 0.9;
    letter-spacing: -0.02em;
    margin: 0;
    min-height: 0.9em;      /* keeps layout steady between states */
    color: var(--deny);
  }

  .verdict--allow .verdict__word { color: var(--allow); }

  .verdict__name {
    font-family: var(--display);
    font-variation-settings: 'wdth' 100, 'wght' 600;
    font-size: clamp(19px, 5.4vw, 25px);
    line-height: 1.2;
    margin: 10px 0 0;
    overflow-wrap: anywhere;
  }

  .verdict__name:empty { display: none; }

  .verdict__reason:empty,
  .verdict__meta:empty { display: none; }

  /* Type and affiliation ride with the name rather than sitting in the facts
     grid — they answer "who is this" and belong beside it. */
  .verdict__meta {
    margin: 6px 0 0;
    font-size: 14px;
    line-height: 1.4;
    color: var(--text);
    opacity: 0.82;
  }

  .verdict__reason {
    margin: 7px 0 0;
    font-size: 15px;
    line-height: 1.45;
    color: var(--text);
    opacity: 0.9;
  }

  /* signature element: where "now" sits inside the visit window */

  .track { margin: 14px 0 0; }

  .track__rail {
    position: relative;
    height: 6px;
    border-radius: 3px;
    background: rgba(232, 236, 247, 0.16);
    overflow: visible;
  }

  .track__fill {
    position: absolute;
    inset: 0 auto 0 0;
    border-radius: 3px;
    background: var(--allow);
    width: 0;
  }

  .track__now {
    position: absolute;
    top: -5px;
    width: 2px;
    height: 16px;
    background: var(--text);
    border-radius: 1px;
    left: 0;
  }

  .track__ends {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    margin-top: 7px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
  }

  .track__ends span:first-child {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .track__remaining {
    color: var(--text);
    opacity: 0.85;
    white-space: nowrap;
  }

  .flag {
    display: flex;
    gap: 10px;
    margin: 12px 20px 0;
    padding: 11px 14px;
    border-radius: 10px;
    background: var(--warn-deep);
    border: 1px solid var(--warn);
    font-size: 14px;
    line-height: 1.5;
  }

  .flag__dot {
    flex: 0 0 auto;
    width: 8px;
    height: 8px;
    margin-top: 6px;
    border-radius: 50%;
    background: var(--warn);
  }

  .facts:empty { display: none; }

  .facts {
    margin: 0;
    padding: 14px 20px 2px;
    display: grid;
    grid-template-columns: minmax(76px, auto) 1fr;
    gap: 8px 16px;
    align-items: baseline;
  }

  .facts dt {
    font-size: 11px;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .facts dd {
    margin: 0;
    font-size: 14px;
    line-height: 1.4;
  }

  /* Purpose is free text from the form; two lines is enough to tell a guard
     why someone is here, and stops one verbose entry pushing the buttons
     off screen. */
  .facts dd.clamp {
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .facts dd.mono { font-family: var(--mono); font-size: 12px; color: var(--muted); }

  .actions {
    margin-top: auto;
    display: flex;
    gap: 8px;
    padding: 12px 20px 16px;
  }

  .actions .btn { flex: 1 1 0; min-width: 0; }

  /* ---------- photo overlay ---------- */

  .photo {
    position: fixed;
    inset: 0;
    z-index: 40;
    background: #000;
    display: none;
    flex-direction: column;
  }

  .photo[data-open] { display: flex; }

  .photo__stage {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* largest size that preserves the photo's own aspect ratio */
  .photo__stage img {
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    object-fit: contain;
    display: block;
  }

  .photo__foot {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 18px calc(14px + env(safe-area-inset-bottom));
    background: #000;
  }

  .photo__name {
    font-family: var(--mono);
    font-size: 13px;
    color: #C6CBD8;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .photo__close {
    margin-left: auto;
    padding: 10px 18px;
    border: 1px solid #3A3A3A;
    border-radius: 9px;
    font-weight: 600;
    font-size: 15px;
  }

  .photo__status {
    color: #8C97B5;
    font-size: 14px;
    text-align: center;
    padding: 0 24px;
  }

  /* ---------- misc ---------- */

  .notice {
    margin: 16px 20px 0;
    padding: 13px 15px;
    border-radius: 10px;
    background: var(--deny-deep);
    border: 1px solid var(--deny);
    font-size: 14px;
    line-height: 1.5;
  }

  .spinner {
    width: 17px;
    height: 17px;
    border: 2px solid rgba(232, 236, 247, 0.28);
    border-top-color: var(--text);
    border-radius: 50%;
    display: inline-block;
    vertical-align: -3px;
    animation: spin 0.7s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  @media (prefers-reduced-motion: reduce) {
    .spinner { animation-duration: 2.4s; }
    .verdict__banner, .facts, .flag { animation: none; }
    .meter--run { animation: none; opacity: 0.25; }
    * { transition: none !important; }
  }
</style>
</head>
<body>

<header class="bar">
  <span class="bar__mark">
    <span class="bar__mark-top">IIT Tirupati</span>
    <span class="bar__mark-sub">Visitor Pass Scanner</span>
  </span>
  <span class="bar__who" id="barWho" hidden></span>
  <button class="bar__out" id="signOut" hidden>Sign out</button>
</header>

<div class="gatestrip" id="gateStrip" hidden>
  <span class="gatestrip__label">Gate</span>
  <span class="gatestrip__name" id="gateStripName"></span>
</div>

<!-- Sign in -->
<section class="pane pad" id="paneSignin" data-active>
  <h2>Authorized Personnel Only</h2>
  <div id="gsiButton"></div>
  <p class="notice" id="signinError" hidden></p>
</section>

<!-- Choose gate -->
<section class="pane pad" id="paneGate">
  <h1>Which gate?</h1>
  <label class="field" for="gateSelect">Post</label>
  <select id="gateSelect">
    <option value="Main Gate">Main Gate</option>
    <option value="South Gate">South Gate</option>
    <option value="Faculty Quarter Gate">Faculty Quarter Gate</option>
  </select>
  <div style="height:20px"></div>
  <button class="btn btn--primary" id="gateConfirm">Start scanning</button>
</section>

<!-- Camera -->
<section class="pane" id="paneScan">
  <div class="scan">
    <div class="viewport" id="viewport">
      <video id="video" playsinline muted></video>
      <div class="reticle"></div>
    </div>

    <div class="checking" id="checking" hidden>
      <span class="spinner"></span>
      <p class="checking__label">Pass captured</p>
      <p class="checking__timer" id="checkingTimer">0.0s</p>
      <p class="checking__note">You can take the pass away. Checking with the server…</p>
    </div>

    <p class="scan__hint" id="scanHint">Hold the visitor's QR code inside the frame.</p>
  </div>
  <p class="notice" id="scanError" hidden></p>
</section>

<!-- Verdict -->
<section class="pane verdict" id="paneVerdict">
  <div class="verdict__banner">
    <div class="meter" id="meter" aria-hidden="true"></div>
    <p class="verdict__word" id="verdictWord"></p>
    <p class="verdict__name" id="verdictName"></p>
    <p class="verdict__meta" id="verdictMeta"></p>
    <p class="verdict__reason" id="verdictReason"></p>
    <div class="track" id="track" hidden>
      <div class="track__rail">
        <div class="track__fill" id="trackFill"></div>
        <div class="track__now" id="trackNow"></div>
      </div>
      <div class="track__ends">
        <span id="trackSpan"></span>
        <span class="track__remaining" id="trackRemaining"></span>
      </div>
    </div>
  </div>

  <div class="flag" id="verdictFlag" hidden>
    <span class="flag__dot"></span>
    <span id="verdictFlagText"></span>
  </div>

  <dl class="facts" id="verdictFacts"></dl>

  <div class="actions">
    <button class="btn btn--primary" id="showPhoto" hidden>Show photo</button>
    <button class="btn" id="scanNext">Scan next visitor</button>
  </div>
</section>

<!-- Photo overlay -->
<div class="photo" id="photoOverlay" role="dialog" aria-modal="true" aria-label="Visitor photograph">
  <div class="photo__stage">
    <p class="photo__status" id="photoStatus"><span class="spinner"></span></p>
    <img id="photoImg" alt="" hidden>
  </div>
  <div class="photo__foot">
    <span class="photo__name" id="photoName"></span>
    <button class="photo__close" id="photoClose">Close</button>
  </div>
</div>

<script src="jsQR.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
</body>
</html>
